[pytest]
# Make `src` and `tests` importable without installing the project.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    slow: loads the real embedding model and the real index (deselect with -m "not slow")
filterwarnings =
    ignore::DeprecationWarning
